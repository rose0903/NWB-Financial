<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWB Financial</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0b1f36;
  --blue:#1261a0;
  --blue2:#1677c8;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#142033;
  --muted:#6c7a8c;
  --border:#e3e9f0;
  --green:#16803c;
  --red:#b42318;
  --shadow:0 8px 30px rgba(11,31,54,.08)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20
}

.brand{
  font-size:21px;
  font-weight:850;
  color:var(--navy)
}

.brandMark{
  display:inline-flex;
  width:34px;
  height:34px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  background:var(--blue);
  color:white;
  margin-right:8px;
  font-weight:900
}

.topRight{
  font-size:13px;
  color:var(--muted)
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:28px 20px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow)
}

.form{
  max-width:450px;
  margin:55px auto
}

h1,h2,h3{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:12px}

.tabs{
  display:flex;
  gap:7px;
  margin:20px 0;
  flex-wrap:wrap
}

.tabs button{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  background:#edf2f7;
  color:#35506b;
  font-weight:750
}

.tabs button.active{
  background:var(--blue);
  color:#fff
}

label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-top:12px
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd6e0;
  border-radius:10px;
  margin:6px 0 12px;
  background:#fff;
  outline:none
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(18,97,160,.1)
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  background:var(--blue);
  color:white;
  font-weight:800
}

.btn:hover{filter:brightness(1.06)}
.btn.alt{background:#eaf1f7;color:var(--blue)}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}

.headerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

.profile{
  display:flex;
  align-items:center;
  gap:12px
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#dcecf8;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px
}

.accountMeta{
  display:flex;
  gap:15px;
  flex-wrap:wrap
}

.accountMeta span{
  font-size:12px;
  color:var(--muted)
}

.accountArea{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:18px;
  margin-bottom:18px
}

.mainBalance{
  color:white;
  background:linear-gradient(135deg,#0b1f36,#1261a0);
  border-radius:20px;
  padding:27px;
  min-height:230px;
  position:relative;
  overflow:hidden
}

.mainBalance:after{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  border-radius:50%;
  right:-80px;
  top:-90px;
  background:rgba(255,255,255,.06)
}

.accountLabel{
  font-size:12px;
  opacity:.75;
  letter-spacing:.5px
}

.currencyTitle{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:800;
  margin-top:10px
}

.flag{
  font-size:24px
}

.bigBalance{
  font-size:39px;
  font-weight:900;
  margin:20px 0 5px
}

.balanceSub{
  font-size:12px;
  opacity:.75
}

.accountPanel{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px
}

.accountPanel h3{
  margin-bottom:15px
}

.detail{
  padding:11px 0;
  border-bottom:1px solid #edf1f5
}

.detail:last-child{border-bottom:0}

.detailLabel{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase
}

.detailValue{
  font-size:14px;
  font-weight:750;
  margin-top:3px
}

.switchRow{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap
}

.switchBox{
  flex:1;
  min-width:220px
}

.switchBox label{
  margin-top:0
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px
}

.statLabel{
  color:var(--muted);
  font-size:12px
}

.statValue{
  font-size:21px;
  font-weight:850;
  margin-top:8px
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px
}

.action{
  border:1px solid var(--border);
  background:#fff;
  border-radius:14px;
  padding:17px;
  text-align:left;
  font-weight:800;
  color:var(--text)
}

.action:hover{
  border-color:#b8d1e5;
  background:#f8fbfe
}

.actionIcon{
  font-size:23px;
  margin-bottom:8px
}

.action span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  margin-top:5px
}

.section{
  margin-top:18px
}

.notice{
  padding:13px 15px;
  border-radius:10px;
  margin:12px 0;
  background:#eef7ee;
  color:#176b35
}

.error{
  background:#fff0f0;
  color:#a51d2d
}

.info{
  background:#eef5ff;
  color:#24527b
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.review{
  background:#f7f9fc;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-top:18px
}

.reviewRow{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #e4e9ef;
  font-size:14px
}

.reviewRow:last-child{border-bottom:0}

.reviewRow span:first-child{
  color:var(--muted)
}

.reviewRow strong{
  text-align:right
}

.recipient{
  background:white;
  border:1px solid #dce5ee;
  border-radius:14px;
  padding:16px;
  margin:15px 0
}

.recipientName{
  font-size:17px;
  font-weight:850
}

.accountNumber{
  font-family:monospace;
  letter-spacing:1px;
  color:var(--muted);
  margin-top:4px
}

.successBox{
  text-align:center;
  padding:25px
}

.successCircle{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#e5f6e9;
  color:var(--green);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:29px;
  font-weight:900;
  margin:0 auto 15px
}

.tableWrap{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid #edf0f3;
  font-size:13px
}

th{
  color:#526176;
  font-size:11px;
  text-transform:uppercase
}

.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  background:#eaf7ed;
  color:#176b35
}

.footer{
  text-align:center;
  padding:30px 15px;
  color:#7a8797;
  font-size:11px
}

@media(max-width:850px){
  .accountArea{
    grid-template-columns:1fr
  }

  .actions{
    grid-template-columns:1fr 1fr
  }

  .grid{
    grid-template-columns:1fr
  }
}

@media(max-width:600px){
  .top{
    padding:0 15px
  }

  .topRight{
    display:none
  }

  .wrap{
    padding:17px 12px
  }

  .form{
    margin:25px auto
  }

  .headerRow{
    align-items:flex-start
  }

  .bigBalance{
    font-size:31px
  }

  .formGrid{
    grid-template-columns:1fr
  }

  .actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="brand">
    <span class="brandMark">N</span>
    NWB Financial
  </div>

  <div class="topRight">
    Personal financial workspace
  </div>

</header>


<main class="wrap">

<section id="auth">

  <div class="card form">

    <h1 id="authTitle">Welcome back</h1>

    <p class="muted">
      Sign in to your NWB Financial workspace.
    </p>

    <div class="tabs">

      <button id="loginTab"
              class="active"
              onclick="showAuth('login')">
        Sign in
      </button>

      <button id="registerTab"
              onclick="showAuth('register')">
        Create account
      </button>

    </div>

    <div id="msg"></div>

    <div id="loginBox">

      <label>Email</label>
      <input id="le"
             type="email"
             placeholder="you@example.com">

      <label>Password</label>
      <input id="lp"
             type="password"
             placeholder="Password">

      <button class="btn"
              style="width:100%"
              onclick="login()">
        Sign in
      </button>

    </div>


    <div id="registerBox" class="hidden">

      <label>Full name</label>
      <input id="rn"
             placeholder="Your full name">

      <label>Email</label>
      <input id="re"
             type="email"
             placeholder="you@example.com">

      <label>Password</label>
      <input id="rp"
             type="password"
             placeholder="At least 8 characters">

      <button class="btn"
              style="width:100%"
              onclick="register()">
        Create account
      </button>

    </div>

  </div>

</section>


<section id="app" class="hidden">

  <div class="headerRow">

    <div class="profile">

      <div class="avatar" id="avatar">N</div>

      <div>

        <h1 id="welcome"
            style="margin-bottom:3px">
          Welcome
        </h1>

        <div class="accountMeta">

          <span>
            Customer account
          </span>

          <span>
            Status: <strong>Active</strong>
          </span>

        </div>

      </div>

    </div>

    <button class="btn danger"
            onclick="logout()">
      Sign out
    </button>

  </div>


  <div class="tabs">

    <button class="active"
            onclick="tab('home',this)">
      Dashboard
    </button>

    <button onclick="tab('transfer',this)">
      Transfer
    </button>

    <button onclick="tab('exchange',this)">
      Exchange
    </button>

    <button onclick="tab('withdraw',this)">
      Withdraw
    </button>

    <button onclick="tab('history',this)">
      Transactions
    </button>

  </div>


  <div id="content"></div>


  <div class="footer">
    NWB Financial interface
  </div>

</section>

</main>


<script>

const $=id=>document.getElementById(id);

let user=null;

let accounts=[
  {
    currency:"USD",
    name:"US Dollar",
    symbol:"$",
    flag:"🇺🇸",
    balance:12500
  }
];

let activeCurrency="USD";

let transactions=[];


const currencyList=[
  ["USD","US Dollar","$","🇺🇸"],
  ["GBP","British Pound","£","🇬🇧"],
  ["EUR","Euro","€","🇪🇺"],
  ["NGN","Nigerian Naira","₦","🇳🇬"],
  ["ZAR","South African Rand","R","🇿🇦"],
  ["CAD","Canadian Dollar","C$","🇨🇦"],
  ["AUD","Australian Dollar","A$","🇦🇺"],
  ["CHF","Swiss Franc","CHF","🇨🇭"],
  ["JPY","Japanese Yen","¥","🇯🇵"],
  ["SGD","Singapore Dollar","S$","🇸🇬"],
  ["AED","UAE Dirham","د.إ","🇦🇪"],
  ["HKD","Hong Kong Dollar","HK$","🇭🇰"],
  ["NZD","New Zealand Dollar","NZ$","🇳🇿"],
  ["SEK","Swedish Krona","kr","🇸🇪"],
  ["NOK","Norwegian Krone","kr","🇳🇴"],
  ["DKK","Danish Krone","kr","🇩🇰"]
];


function money(value,currency){

  const c=currencyList.find(x=>x[0]===currency);

  const symbol=c?c[2]:"";

  return symbol+
    Number(value).toLocaleString(undefined,{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


function accountInfo(currency){

  return currencyList.find(x=>x[0]===currency);

}


function showMessage(text,error=false){

  $("msg").innerHTML=
    `<div class="notice ${error?"error":""}">
      ${text}
    </div>`;

}


function showAuth(type){

  const login=type==="login";

  $("loginBox").classList.toggle("hidden",!login);

  $("registerBox").classList.toggle("hidden",login);

  $("loginTab").classList.toggle("active",login);

  $("registerTab").classList.toggle("active",!login);

  $("authTitle").textContent=
    login?"Welcome back":"Create account";

  $("msg").innerHTML="";

}


function login(){

  const email=$("le").value.trim();

  const password=$("lp").value;

  if(!email||!password){

    showMessage(
      "Please enter your email and password.",
      true
    );

    return;
  }

  user={
    name:email.split("@")[0],
    email:email,
    accountNumber:createAccountNumber()
  };

  openApp();

}


function register(){

  const name=$("rn").value.trim();

  const email=$("re").value.trim();

  const password=$("rp").value;

  if(!name||!email||password.length<8){

    showMessage(
      "Enter your name, email and a password of at least 8 characters.",
      true
    );

    return;
  }

  user={
    name:name,
    email:email,
    accountNumber:createAccountNumber()
  };

  openApp();

}


function createAccountNumber(){

  return String(
    Math.floor(
      1000000000+
      Math.random()*8999999999
    )
  );

}


function openApp(){

  $("auth").classList.add("hidden");

  $("app").classList.remove("hidden");

  $("welcome").textContent=
    "Hello, "+user.name;

  $("avatar").textContent=
    user.name.charAt(0).toUpperCase();

  tab(
    "home",
    document.querySelector("#app .tabs button")
  );

}


function logout(){

  user=null;

  $("app").classList.add("hidden");

  $("auth").classList.remove("hidden");

  $("le").value="";

  $("lp").value="";

  showAuth("login");

}


function tab(name,el){

  document
    .querySelectorAll("#app .tabs button")
    .forEach(x=>x.classList.remove("active"));

  if(el)el.classList.add("active");

  if(name==="home")home();

  if(name==="transfer")transfer();

  if(name==="exchange")exchange();

  if(name==="withdraw")withdraw();

  if(name==="history")history();

}


function home(){

  const account=
    accounts.find(a=>a.currency===activeCurrency);

  const info=
    accountInfo(activeCurrency);

  $("content").innerHTML=`

    <div class="accountArea">

      <div class="mainBalance">

        <div class="accountLabel">
          SELECTED ACCOUNT
        </div>

        <div class="currencyTitle">

          <span class="flag">
            ${info[3]}
          </span>

          ${info[0]} — ${info[1]}

        </div>

        <div class="bigBalance">
          ${money(account.balance,account.currency)}
        </div>

        <div class="balanceSub">
          Available balance
        </div>

      </div>


      <div class="accountPanel">

        <h3>Account details</h3>

        <div class="detail">

          <div class="detailLabel">
            Account number
          </div>

          <div class="detailValue">
            ${user.accountNumber}
          </div>

        </div>

        <div class="detail">

          <div class="detailLabel">
            Account currency
          </div>

          <div class="detailValue">
            ${info[0]} — ${info[1]}
          </div>

        </div>

        <div class="detail">

          <div class="detailLabel">
            Account status
          </div>

          <div class="detailValue">
            Active
          </div>

        </div>

      </div>

    </div>


    <div class="card section">

      <div class="switchRow">

        <div class="switchBox">

          <label>
            Your currency accounts
          </label>

          <select id="accountSelector"
                  onchange="switchAccount(this.value)">

            ${accounts.map(a=>{

              const i=accountInfo(a.currency);

              return `
                <option
                  value="${a.currency}"
                  ${a.currency===activeCurrency?"selected":""}>
                  ${i[3]} ${a.currency} — ${i[1]}
                </option>
              `;

            }).join("")}

          </select>

        </div>

        <button class="btn"
                onclick="addAccount()">
          + Add currency account
        </button>

      </div>

    </div>


    <div class="grid section">

      <div class="stat">

        <div class="statLabel">
          Available balance
        </div>

        <div class="statValue">
          ${money(account.balance,account.currency)}
        </div>

      </div>

      <div class="stat">

        <div class="statLabel">
          Currency
        </div>

        <div class="statValue">
          ${account.currency}
        </div>

      </div>

      <div class="stat">

        <div class="statLabel">
          Recent activity
        </div>

        <div class="statValue">
          ${transactions.length}
        </div>

      </div>

    </div>


    <div class="card section">

      <h2>Quick actions</h2>

      <p class="muted">
        Manage your selected currency account.
      </p>

      <div class="actions">

        <button class="action"
                onclick="tab('transfer')">

          <div class="actionIcon">↗</div>

          Transfer

          <span>
            Send funds to a recipient
          </span>

        </button>


        <button class="action"
                onclick="tab('exchange')">

          <div class="actionIcon">⇄</div>

          Exchange

          <span>
            Convert currencies
          </span>

        </button>


        <button class="action"
                onclick="tab('withdraw')">

          <div class="actionIcon">↓</div>

          Withdraw

          <span>
            Request a withdrawal
          </span>

        </button>


        <button class="action"
                onclick="tab('history')">

          <div class="actionIcon">☷</div>

          Transactions

          <span>
            View recent activity
          </span>

        </button>

      </div>

    </div>

  `;

}


function switchAccount(currency){

  activeCurrency=currency;

  home();

}


function addAccount(){

  const available=
    currencyList.filter(c=>
      !accounts.some(a=>a.currency===c[0])
    );

  if(!available.length){

    alert("All available currency accounts have been added.");

    return;

  }

  const selected=
    prompt(
      "Enter currency code to add:\n\n"+
      available.map(c=>c[0]+" — "+c[1]).join("\n")
    );

  if(!selected)return;

  const code=selected.trim().toUpperCase();

  const info=
    currencyList.find(c=>c[0]===code);

  if(!info){

    alert("Currency not available.");

    return;

  }

  if(accounts.some(a=>a.currency===code)){

    alert("That currency account already exists.");

    return;

  }

  accounts.push({

    currency:info[0],
    name:info[1],
    symbol:info[2],
    flag:info[3],
    balance:0

  });

  activeCurrency=code;

  home();

}


function transfer(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Transfer</h2>

      <p class="muted">
        Enter recipient information and review the payment before confirming.
      </p>

      <div class="formGrid">

        <div>

          <label>Recipient name</label>

          <input id="recipientName"
                 placeholder="Full name">

        </div>

        <div>

          <label>Account number</label>

          <input id="recipientAccount"
                 inputmode="numeric"
                 placeholder="Account number">

        </div>

      </div>


      <label>Bank</label>

      <input id="recipientBank"
             placeholder="Bank name">


      <label>Currency</label>

      <select id="transferCurrency">

        ${accounts.map(a=>{

          const i=accountInfo(a.currency);

          return `
            <option value="${a.currency}"
              ${a.currency===activeCurrency?"selected":""}>
              ${i[3]} ${i[0]} — ${i[1]}
            </option>
          `;

        }).join("")}

      </select>


      <label>Amount</label>

      <input id="transferAmount"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">


      <label>Payment reference</label>

      <input id="transferReference"
             placeholder="Optional reference">


      <button class="btn"
              onclick="reviewTransfer()">
        Review transfer
      </button>

      <div id="transferOutput"></div>

    </div>

  `;

}


function reviewTransfer(){

  const name=
    $("recipientName").value.trim();

  const account=
    $("recipientAccount").value.trim();

  const bank=
    $("recipientBank").value.trim();

  const currency=
    $("transferCurrency").value;

  const amount=
    Number($("transferAmount").value);

  const reference=
    $("transferReference").value.trim()||
    "Payment";


  if(!name||!account||!bank){

    $("transferOutput").innerHTML=
      `<div class="notice error">
        Enter the recipient name, account number and bank.
      </div>`;

    return;

  }


  if(!amount||amount<=0){

    $("transferOutput").innerHTML=
      `<div class="notice error">
        Enter a valid amount.
      </div>`;

    return;

  }


  const source=
    accounts.find(a=>a.currency===currency);


  if(!source||amount>source.balance){

    $("transferOutput").innerHTML=
      `<div class="notice error">
        Insufficient available balance.
      </div>`;

    return;

  }


  $("transferOutput").innerHTML=`

    <div class="review">

      <h3>Review payment</h3>

      <div class="recipient">

        <div class="recipientName">
          ${safe(name)}
        </div>

        <div class="accountNumber">
          Account ${safe(account)}
        </div>

        <div class="small muted">
          ${safe(bank)}
        </div>

      </div>


      <div class="reviewRow">

        <span>Amount</span>

        <strong>
          ${money(amount,currency)}
        </strong>

      </div>


      <div class="reviewRow">

        <span>Currency</span>

        <strong>
          ${currency}
        </strong>

      </div>


      <div class="reviewRow">

        <span>Reference</span>

        <strong>
          ${safe(reference)}
        </strong>

      </div>


      <div style="margin-top:18px">

        <button class="btn"
          onclick="confirmTransfer()">
          Confirm transfer
        </button>

        <button class="btn alt"
          onclick="transfer()"
          style="margin-left:7px">
          Edit
        </button>

      </div>

    </div>

  `;

}


function confirmTransfer(){

  const name=
    $("recipientName").value.trim();

  const account=
    $("recipientAccount").value.trim();

  const bank=
    $("recipientBank").value.trim();

  const currency=
    $("transferCurrency").value;

  const amount=
    Number($("transferAmount").value);

  const referenceText=
    $("transferReference").value.trim()||
    "Payment";


  const source=
    accounts.find(a=>a.currency===currency);


  if(!source||amount>source.balance){

    $("transferOutput").innerHTML=
      `<div class="notice error">
        Insufficient available balance.
      </div>`;

    return;

  }


  source.balance-=amount;


  const reference=
    "NWB-"+
    Date.now().toString(36).toUpperCase();


  transactions.unshift({

    date:new Date(),

    type:"Transfer",

    currency:currency,

    amount:-amount,

    status:"Completed",

    reference:reference,

    description:referenceText,

    recipient:name,

    account:account,

    bank:bank

  });


  $("content").innerHTML=`

    <div class="card">

      <div class="successBox">

        <div class="successCircle">
          ✓
        </div>

        <h2>Transfer completed</h2>

        <p class="muted">
          Payment successfully recorded.
        </p>


        <div class="recipient"
             style="text-align:left">

          <div class="recipientName">
            ${safe(name)}
          </div>

          <div class="accountNumber">
            Account ${safe(account)}
          </div>

          <div class="small muted">
            ${safe(bank)}
          </div>

        </div>


        <div class="review">

          <div class="reviewRow">

            <span>Amount</span>

            <strong>
              ${money(amount,currency)}
            </strong>

          </div>


          <div class="reviewRow">

            <span>Reference</span>

            <strong>
              ${reference}
            </strong>

          </div>


          <div class="reviewRow">

            <span>Status</span>

            <strong>
              Completed
            </strong>

          </div>

        </div>


        <button class="btn"
                onclick="tab('home')">
          Dashboard
        </button>


        <button class="btn alt"
                onclick="tab('history')"
                style="margin-left:7px">
          Transactions
        </button>

      </div>

    </div>

  `;

}


function exchange(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Exchange</h2>

      <p class="muted">
        Convert between your currency accounts.
      </p>


      <label>From</label>

      <select id="exchangeFrom">

        ${accounts.map(a=>{

          const i=accountInfo(a.currency);

          return `
            <option value="${a.currency}"
              ${a.currency===activeCurrency?"selected":""}>
              ${i[3]} ${i[0]} — ${i[1]}
            </option>
          `;

        }).join("")}

      </select>


      <label>To</label>

      <select id="exchangeTo">

        ${currencyList.map(c=>`

          <option value="${c[0]}">
            ${c[3]} ${c[0]} — ${c[1]}
          </option>

        `).join("")}

      </select>


      <label>Amount</label>

      <input id="exchangeAmount"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">


      <button class="btn"
              onclick="doExchange()">
        Exchange
      </button>


      <div id="exchangeOutput"></div>

    </div>

  `;

}


function doExchange(){

  const from=
    $("exchangeFrom").value;

  const to=
    $("exchangeTo").value;

  const amount=
    Number($("exchangeAmount").value);


  if(from===to){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Choose two different currencies.
      </div>`;

    return;

  }


  if(!amount||amount<=0){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Enter a valid amount.
      </div>`;

    return;

  }


  const source=
    accounts.find(a=>a.currency===from);


  if(!source||amount>source.balance){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Insufficient available balance.
      </div>`;

    return;

  }


  let destination=
    accounts.find(a=>a.currency===to);


  if(!destination){

    const info=accountInfo(to);

    destination={
      currency:info[0],
      name:info[1],
      symbol:info[2],
      flag:info[3],
      balance:0
    };

    accounts.push(destination);

  }


  const rates={
    USD:1,
    GBP:1.28,
    EUR:1.09,
    NGN:.00067,
    ZAR:.055,
    CAD:.73,
    AUD:.66,
    CHF:1.16,
    JPY:.0067,
    SGD:.74,
    AED:.272,
    HKD:.128,
    NZD:.60,
    SEK:.095,
    NOK:.094,
    DKK:.146
  };


  const received=
    amount*rates[from]/rates[to];


  source.balance-=amount;

  destination.balance+=received;


  const reference=
    "NWB-"+Date.now().toString(36).toUpperCase();


  transactions.unshift({

    date:new Date(),

    type:"Exchange",

    currency:from,

    amount:-amount,

    status:"Completed",

    reference:reference,

    description:`Exchange ${from} to ${to}`

  });


  activeCurrency=to;


  $("exchangeOutput").innerHTML=
    `<div class="notice">
      Exchange completed.<br>
      Received <strong>${money(received,to)}</strong>.
    </div>`;


  setTimeout(home,1500);

}


function withdraw(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Withdraw</h2>

      <p class="muted">
        Create a withdrawal request from the selected account.
      </p>


      <label>Currency</label>

      <select id="withdrawCurrency">

        ${accounts.map(a=>{

          const i=accountInfo(a.currency);

          return `
            <option value="${a.currency}"
              ${a.currency===activeCurrency?"selected":""}>
              ${i[3]} ${i[0]} — ${i[1]}
            </option>
          `;

        }).join("")}

      </select>


      <label>Amount</label>

      <input id="withdrawAmount"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">


      <label>Note</label>

      <input id="withdrawNote"
             placeholder="Optional note">


      <button class="btn"
              onclick="doWithdraw()">
        Request withdrawal
      </button>


      <div id="withdrawOutput"></div>

    </div>

  `;

}


function doWithdraw(){

  const currency=
    $("withdrawCurrency").value;

  const amount=
    Number($("withdrawAmount").value);

  const note=
    $("withdrawNote").value.trim()||
    "Withdrawal request";


  const account=
    accounts.find(a=>a.currency===currency);


  if(!amount||amount<=0){

    $("withdrawOutput").innerHTML=
      `<div class="notice error">
        Enter a valid amount.
      </div>`;

    return;

  }


  if(!account||amount>account.balance){

    $("withdrawOutput").innerHTML=
      `<div class="notice error">
        Insufficient available balance.
      </div>`;

    return;

  }


  account.balance-=amount;


  const reference=
    "NWB-"+Date.now().toString(36).toUpperCase();


  transactions.unshift({

    date:new Date(),

    type:"Withdrawal",

    currency:currency,

    amount:-amount,

    status:"Pending",

    reference:reference,

    description:note

  });


  $("withdrawOutput").innerHTML=
    `<div class="notice">
      Withdrawal request recorded.<br>
      Reference: <strong>${reference}</strong>
    </div>`;


  setTimeout(home,1500);

}


function history(){

  let rows="";


  transactions.forEach(t=>{

    rows+=`

      <tr>

        <td>
          ${t.date.toLocaleString()}
        </td>

        <td>
          ${safe(t.type)}
        </td>

        <td>
          ${safe(t.currency)}
        </td>

        <td>
          ${money(Math.abs(t.amount),t.currency)}
        </td>

        <td>
          <span class="status">
            ${safe(t.status)}
          </span>
        </td>

        <td>
          ${safe(t.reference)}
        </td>

      </tr>

    `;

  });


  if(!rows){

    rows=`

      <tr>

        <td colspan="6">
          No transactions yet.
        </td>

      </tr>

    `;

  }


  $("content").innerHTML=`

    <div class="card">

      <h2>Transactions</h2>

      <p class="muted">
        Recent account activity.
      </p>


      <div class="tableWrap">

        <table>

          <tr>

            <th>Date</th>
            <th>Type</th>
            <th>Currency</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Reference</th>

          </tr>

          ${rows}

        </table>

      </div>

    </div>

  `;

}


function safe(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
