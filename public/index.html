<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWB Financial</title>

<style>
*{box-sizing:border-box}
:root{
  --navy:#0b1f36;
  --blue:#1261a0;
  --blue2:#1976d2;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#68778d;
  --border:#e3e9ef;
  --green:#16803c;
  --orange:#a86400;
  --red:#b42318;
  --shadow:0 8px 30px rgba(11,31,54,.08)
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:15px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  font-weight:850;
  color:var(--navy)
}
.logo{
  width:36px;
  height:36px;
  border-radius:9px;
  background:linear-gradient(135deg,#102a43,#1261a0);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900
}
.topRight{font-size:13px;color:var(--muted)}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:25px 18px
}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow)
}
.form{
  max-width:450px;
  margin:55px auto
}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:12px}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:20px 0
}
.tabs button{
  border:0;
  background:#eaf0f6;
  color:#31516e;
  padding:10px 14px;
  border-radius:9px;
  font-weight:750
}
.tabs button.active{
  background:var(--blue);
  color:white
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-top:12px
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccd6e0;
  border-radius:10px;
  margin:6px 0 11px;
  background:white;
  outline:none
}
input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(18,97,160,.1)
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  background:var(--blue);
  color:white;
  font-weight:800
}
.btn.alt{
  background:#eaf1f7;
  color:var(--blue)
}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}

.headerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}
.profile{
  display:flex;
  align-items:center;
  gap:11px
}
.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#dcecf8;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900
}

.balance{
  background:linear-gradient(135deg,#0b1f36,#1261a0);
  color:white;
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
  margin-bottom:17px
}
.balanceLabel{
  opacity:.8;
  font-size:12px
}
.balanceAmount{
  font-size:34px;
  font-weight:900;
  margin:8px 0
}
.accountNumber{
  opacity:.8;
  font-size:12px
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px
}
.action{
  border:1px solid var(--border);
  background:white;
  border-radius:13px;
  padding:16px;
  text-align:left;
  font-weight:800;
  color:var(--text)
}
.action:hover{
  border-color:#b7cee1;
  background:#f8fbfe
}
.action span{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:500;
  margin-top:5px
}

.notice{
  padding:12px 14px;
  border-radius:10px;
  margin:12px 0;
  background:#eef5ff;
  color:#24527b;
  font-size:13px
}
.notice.success{
  background:#eaf7ed;
  color:#176b35
}
.notice.warning{
  background:#fff4df;
  color:#8b5700
}
.notice.error{
  background:#fff0f0;
  color:#a51d2d
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px
}

.currencyCard{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px
}
.currencyName{
  color:var(--muted);
  font-size:12px
}
.currencyAmount{
  font-size:23px;
  font-weight:850;
  margin-top:7px
}

table{
  width:100%;
  border-collapse:collapse
}
th,td{
  text-align:left;
  padding:12px 9px;
  border-bottom:1px solid #edf0f3;
  font-size:13px
}
th{
  color:#647386;
  font-size:10px;
  text-transform:uppercase
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:850
}
.status.Pending{
  background:#fff4df;
  color:#9a6100
}
.status.Approved{
  background:#eaf7ed;
  color:#176b35
}
.status.Rejected{
  background:#fff0f0;
  color:#a51d2d
}

.recipient{
  background:#f7f9fc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin:12px 0
}

.footer{
  text-align:center;
  padding:30px 10px;
  color:#7b8795;
  font-size:11px
}

@media(max-width:700px){
  .topRight{display:none}
  .wrap{padding:15px 12px}
  .form{margin:25px auto}
  .actions{grid-template-columns:1fr 1fr}
  .balanceAmount{font-size:29px}
  .tableWrap{overflow:auto}
  table{min-width:700px}
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">
    <div class="logo">N</div>
    NWB Financial
  </div>
  <div class="topRight">Personal banking</div>
</header>

<main class="wrap">

<section id="auth">

  <div class="card form">

    <h1 id="authTitle">Welcome back</h1>

    <p class="muted">
      Sign in to your account.
    </p>

    <div class="tabs">
      <button id="loginTab"
              class="active"
              onclick="showAuth('login')">
        Sign in
      </button>

      <button id="registerTab"
              onclick="showAuth('register')">
        Create account
      </button>
    </div>

    <div id="msg"></div>

    <div id="loginBox">

      <label>Email</label>
      <input id="le"
             type="email"
             placeholder="you@example.com">

      <label>Password</label>
      <input id="lp"
             type="password"
             placeholder="Password">

      <button class="btn"
              style="width:100%"
              onclick="login()">
        Sign in
      </button>

    </div>

    <div id="registerBox" class="hidden">

      <label>Full name</label>
      <input id="rn"
             placeholder="Your full name">

      <label>Email</label>
      <input id="re"
             type="email"
             placeholder="you@example.com">

      <label>Password</label>
      <input id="rp"
             type="password"
             placeholder="At least 8 characters">

      <button class="btn"
              style="width:100%"
              onclick="register()">
        Create account
      </button>

    </div>

  </div>

</section>


<section id="app" class="hidden">

  <div class="headerRow">

    <div class="profile">

      <div class="avatar" id="avatar">
        N
      </div>

      <div>
        <h2 id="welcome" style="margin:0">
          Welcome
        </h2>

        <div class="muted small">
          Personal account
        </div>
      </div>

    </div>

    <button class="btn danger"
            onclick="logout()">
      Sign out
    </button>

  </div>


  <div class="tabs">

    <button class="active"
            onclick="tab('home',this)">
      Dashboard
    </button>

    <button onclick="tab('transfer',this)">
      Transfer
    </button>

    <button onclick="tab('exchange',this)">
      Exchange
    </button>

    <button onclick="tab('withdraw',this)">
      Withdraw
    </button>

    <button onclick="tab('history',this)">
      Transactions
    </button>

  </div>


  <div id="content"></div>

  <div class="footer">
    NWB Financial
  </div>

</section>

</main>


<script>

const $=id=>document.getElementById(id);

let user=null;

let wallets=[
  {currency:"USD",balance:12500},
  {currency:"GBP",balance:4200},
  {currency:"EUR",balance:3100},
  {currency:"NGN",balance:2500000},
  {currency:"ZAR",balance:18000},
  {currency:"CAD",balance:1900},
  {currency:"AUD",balance:2200},
  {currency:"CHF",balance:1500},
  {currency:"JPY",balance:180000},
  {currency:"AED",balance:6000},
  {currency:"SGD",balance:1800},
  {currency:"NZD",balance:2100}
];

let transactions=[];

const currencySymbols={
  USD:"$",
  GBP:"£",
  EUR:"€",
  NGN:"₦",
  ZAR:"R",
  CAD:"C$",
  AUD:"A$",
  CHF:"CHF ",
  JPY:"¥",
  AED:"د.إ ",
  SGD:"S$",
  NZD:"NZ$"
};


function money(value,currency){

  return (currencySymbols[currency]||"")+
    Number(value).toLocaleString(undefined,{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


function showMessage(text,type="info"){

  $("msg").innerHTML=
    `<div class="notice ${type}">
      ${text}
    </div>`;

}


function showAuth(type){

  const login=type==="login";

  $("loginBox")
    .classList.toggle("hidden",!login);

  $("registerBox")
    .classList.toggle("hidden",login);

  $("loginTab")
    .classList.toggle("active",login);

  $("registerTab")
    .classList.toggle("active",!login);

  $("authTitle").textContent=
    login?"Welcome back":"Create your account";

  $("msg").innerHTML="";

}


function login(){

  const email=$("le").value.trim();
  const password=$("lp").value;

  if(!email||!password){

    showMessage(
      "Please enter your email and password.",
      "error"
    );

    return;
  }

  user={
    name:email.split("@")[0],
    email:email,
    id:"CUS-"+Date.now()
  };

  openApp();

}


function register(){

  const name=$("rn").value.trim();
  const email=$("re").value.trim();
  const password=$("rp").value;

  if(!name||!email||password.length<8){

    showMessage(
      "Enter your name, email and a password of at least 8 characters.",
      "error"
    );

    return;
  }

  user={
    name:name,
    email:email,
    id:"CUS-"+Date.now()
  };

  openApp();

}


function openApp(){

  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("welcome").textContent=
    "Hello, "+user.name;

  $("avatar").textContent=
    user.name.charAt(0).toUpperCase();

  tab(
    "home",
    document.querySelector("#app .tabs button")
  );

}


function logout(){

  user=null;

  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");

  $("le").value="";
  $("lp").value="";

  showAuth("login");

}


function tab(name,el){

  document
    .querySelectorAll("#app .tabs button")
    .forEach(x=>x.classList.remove("active"));

  if(el)el.classList.add("active");

  if(name==="home")home();
  if(name==="transfer")transfer();
  if(name==="exchange")exchange();
  if(name==="withdraw")withdraw();
  if(name==="history")history();

}


function home(){

  const primary=wallets[0];

  $("content").innerHTML=`

    <div class="balance">

      <div class="balanceLabel">
        Available balance
      </div>

      <div class="balanceAmount">
        ${money(primary.balance,primary.currency)}
      </div>

      <div class="accountNumber">
        ${primary.currency} account
      </div>

      <div class="actions">

        <button class="action"
                onclick="tab('transfer')">
          Transfer
          <span>Send a transfer</span>
        </button>

        <button class="action"
                onclick="tab('exchange')">
          Exchange
          <span>Convert currency</span>
        </button>

        <button class="action"
                onclick="tab('withdraw')">
          Withdraw
          <span>Create a request</span>
        </button>

        <button class="action"
                onclick="tab('history')">
          Activity
          <span>View transactions</span>
        </button>

      </div>

    </div>


    <div class="card">

      <div style="display:flex;
                  justify-content:space-between;
                  align-items:center;
                  gap:10px">

        <div>
          <h2>My accounts</h2>
          <p class="muted small">
            Your available currency accounts
          </p>
        </div>

      </div>

      <div class="grid">

        ${wallets.map(w=>`

          <div class="currencyCard">

            <div class="currencyName">
              ${w.currency} ACCOUNT
            </div>

            <div class="currencyAmount">
              ${money(w.balance,w.currency)}
            </div>

          </div>

        `).join("")}

      </div>

    </div>

  `;

}


function currencyOptions(id){

  return `
    <select id="${id}">
      ${wallets.map(w=>`
        <option value="${w.currency}">
          ${w.currency}
        </option>
      `).join("")}
    </select>
  `;

}


function transfer(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Transfer money</h2>

      <p class="muted">
        Enter the recipient details below.
      </p>

      <label>Recipient full name</label>

      <input id="recipientName"
             placeholder="Recipient full name">

      <label>Recipient account number</label>

      <input id="recipientAccount"
             inputmode="numeric"
             placeholder="Account number">

      <label>Recipient bank</label>

      <input id="recipientBank"
             placeholder="Bank name">

      <label>Currency</label>

      ${currencyOptions("tc")}

      <label>Amount</label>

      <input id="ta"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">

      <label>Payment reference</label>

      <input id="td"
             placeholder="Optional reference">

      <button class="btn"
              onclick="submitTransfer()">
        Continue transfer
      </button>

      <div id="transferOutput"></div>

    </div>

  `;

}


function submitTransfer(){

  const recipientName=
    $("recipientName").value.trim();

  const recipientAccount=
    $("recipientAccount").value.trim();

  const recipientBank=
    $("recipientBank").value.trim();

  const currency=
    $("tc").value;

  const amount=
    Number($("ta").value);

  const referenceText=
    $("td").value.trim();

  if(
    !recipientName||
    !recipientAccount||
    !recipientBank||
    !amount||
    amount<=0
  ){

    $("transferOutput").innerHTML=`
      <div class="notice error">
        Please complete all recipient details and enter a valid amount.
      </div>
    `;

    return;
  }

  const wallet=
    wallets.find(w=>w.currency===currency);

  if(amount>wallet.balance){

    $("transferOutput").innerHTML=`
      <div class="notice error">
        Insufficient available balance.
      </div>
    `;

    return;
  }

  /*
    The amount is NOT deducted yet.
    The transfer is placed into the shared
    approval queue first.
  */

  const transaction={
    id:"TX-"+Date.now(),
    customerId:user.id,
    customerName:user.name,
    recipientName:recipientName,
    recipientAccount:recipientAccount,
    recipientBank:recipientBank,
    currency:currency,
    amount:amount,
    reference:referenceText||
      "Payment",
    status:"Pending",
    createdAt:new Date().toISOString()
  };

  transactions.unshift(transaction);

  saveSharedTransactions();

  $("transferOutput").innerHTML=`

    <div class="notice warning">

      <strong>Transfer submitted for approval.</strong>

      <br><br>

      Recipient:
      <strong>${escapeHtml(recipientName)}</strong>

      <br>

      Account:
      <strong>${escapeHtml(recipientAccount)}</strong>

      <br>

      Amount:
      <strong>${money(amount,currency)}</strong>

      <br><br>

      Reference:
      <strong>${transaction.id}</strong>

      <br><br>

      The transaction is currently
      <strong>Pending</strong>.

    </div>

  `;

}


function exchange(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Currency exchange</h2>

      <p class="muted">
        Convert between available currency accounts.
      </p>

      <label>From</label>
      ${currencyOptions("ef")}

      <label>To</label>
      ${currencyOptions("et")}

      <label>Amount</label>

      <input id="ea"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">

      <button class="btn"
              onclick="doExchange()">
        Exchange currency
      </button>

      <div id="exchangeOutput"></div>

    </div>

  `;

}


function doExchange(){

  const from=$("ef").value;
  const to=$("et").value;
  const amount=Number($("ea").value);

  if(from===to){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Choose different currencies.
      </div>`;

    return;
  }

  if(!amount||amount<=0){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Enter a valid amount.
      </div>`;

    return;
  }

  const source=
    wallets.find(w=>w.currency===from);

  const destination=
    wallets.find(w=>w.currency===to);

  if(amount>source.balance){

    $("exchangeOutput").innerHTML=
      `<div class="notice error">
        Insufficient balance.
      </div>`;

    return;
  }

  const rates={
    USD:1,
    GBP:1.28,
    EUR:1.09,
    NGN:.00067,
    ZAR:.055,
    CAD:.73,
    AUD:.66,
    CHF:1.13,
    JPY:.0068,
    AED:.272,
    SGD:.74,
    NZD:.60
  };

  const received=
    amount*rates[from]/rates[to];

  source.balance-=amount;
  destination.balance+=received;

  saveWallets();

  transactions.unshift({
    id:"TX-"+Date.now(),
    customerId:user.id,
    customerName:user.name,
    recipientName:"Currency conversion",
    recipientAccount:"—",
    recipientBank:"NWB Financial",
    currency:from,
    amount:amount,
    reference:"Currency exchange",
    status:"Approved",
    createdAt:new Date().toISOString()
  });

  saveSharedTransactions();

  $("exchangeOutput").innerHTML=
    `<div class="notice success">
      Exchange completed. Received
      <strong>${money(received,to)}</strong>.
    </div>`;

  setTimeout(home,1200);

}


function withdraw(){

  $("content").innerHTML=`

    <div class="card">

      <h2>Withdrawal request</h2>

      <p class="muted">
        Create a withdrawal request.
      </p>

      <label>Currency</label>
      ${currencyOptions("wc")}

      <label>Amount</label>

      <input id="wa"
             type="number"
             min="0"
             step="0.01"
             placeholder="0.00">

      <label>Note</label>

      <input id="wd"
             placeholder="Withdrawal note">

      <button class="btn"
              onclick="submitWithdrawal()">
        Submit request
      </button>

      <div id="withdrawOutput"></div>

    </div>

  `;

}


function submitWithdrawal(){

  const currency=$("wc").value;
  const amount=Number($("wa").value);
  const note=$("wd").value.trim()||"Withdrawal request";

  if(!amount||amount<=0){

    $("withdrawOutput").innerHTML=
      `<div class="notice error">
        Enter a valid amount.
      </div>`;

    return;
  }

  const wallet=
    wallets.find(w=>w.currency===currency);

  if(amount>wallet.balance){

    $("withdrawOutput").innerHTML=
      `<div class="notice error">
        Insufficient balance.
      </div>`;

    return;
  }

  const transaction={
    id:"TX-"+Date.now(),
    customerId:user.id,
    customerName:user.name,
    recipientName:"Withdrawal",
    recipientAccount:"—",
    recipientBank:"—",
    currency:currency,
    amount:amount,
    reference:note,
    status:"Pending",
    createdAt:new Date().toISOString()
  };

  transactions.unshift(transaction);

  saveSharedTransactions();

  $("withdrawOutput").innerHTML=
    `<div class="notice warning">
      Withdrawal request submitted.
      <br><br>
      Reference:
      <strong>${transaction.id}</strong>
      <br>
      Status:
      <strong>Pending</strong>
    </div>`;

}


function history(){

  /*
    Pull latest status changes from
    the shared approval queue.
  */

  loadSharedTransactions();

  const mine=
    transactions.filter(
      t=>!user||t.customerId===user.id
    );

  let rows="";

  mine.forEach(t=>{

    rows+=`

      <tr>

        <td>
          ${new Date(t.createdAt).toLocaleString()}
        </td>

        <td>
          ${escapeHtml(t.recipientName)}
        </td>

        <td>
          ${escapeHtml(t.recipientAccount)}
        </td>

        <td>
          ${money(t.amount,t.currency)}
        </td>

        <td>
          <span class="status ${t.status}">
            ${t.status}
          </span>
        </td>

        <td>
          ${t.id}
        </td>

      </tr>

    `;

  });

  if(!rows){

    rows=`
      <tr>
        <td colspan="6">
          No transactions yet.
        </td>
      </tr>
    `;

  }

  $("content").innerHTML=`

    <div class="card">

      <h2>Transactions</h2>

      <p class="muted">
        Your recent transaction activity.
      </p>

      <div class="tableWrap">

        <table>

          <tr>
            <th>Date</th>
            <th>Recipient</th>
            <th>Account</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Reference</th>
          </tr>

          ${rows}

        </table>

      </div>

    </div>

  `;

}


function saveSharedTransactions(){

  localStorage.setItem(
    "nwb_transactions",
    JSON.stringify(transactions)
  );

}


function loadSharedTransactions(){

  try{

    const saved=
      localStorage.getItem("nwb_transactions");

    if(saved)
      transactions=JSON.parse(saved);

  }catch(e){

    transactions=[];

  }

}


function saveWallets(){

  localStorage.setItem(
    "nwb_wallets",
    JSON.stringify(wallets)
  );

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
  Check for admin decisions periodically.
*/

setInterval(()=>{

  if(user){

    loadSharedTransactions();

    if(
      !$("app").classList.contains("hidden")
    ){

      const active=
        document.querySelector(
          "#app .tabs button.active"
        );

      if(active &&
         active.textContent.includes("Transactions")){

        history();

      }

    }

  }

},3000);


</script>
