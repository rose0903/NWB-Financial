<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWB Financial — Administration</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0b1f36;
  --blue:#1261a0;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#142033;
  --muted:#6d7b8d;
  --border:#e2e8ef;
  --green:#16803c;
  --orange:#a86400;
  --red:#b42318;
  --shadow:0 7px 25px rgba(11,31,54,.07)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
  height:68px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:20
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  font-weight:850;
  color:var(--navy)
}

.logo{
  width:36px;
  height:36px;
  border-radius:9px;
  background:linear-gradient(135deg,#102a43,#1261a0);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900
}

.adminBadge{
  font-size:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#eaf1f7;
  color:var(--blue);
  font-weight:850
}

.topRight{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#dcecf8;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900
}

.layout{
  display:grid;
  grid-template-columns:225px 1fr;
  min-height:calc(100vh - 68px)
}

.sidebar{
  background:var(--navy);
  color:white;
  padding:18px 11px
}

.sideTitle{
  font-size:10px;
  color:#91a4b8;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:11px
}

.navBtn{
  width:100%;
  border:0;
  background:transparent;
  color:#c9d5e1;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin-bottom:3px;
  font-weight:750
}

.navBtn:hover,
.navBtn.active{
  background:#163c60;
  color:white
}

.main{
  padding:26px;
  width:100%;
  max-width:1450px
}

.pageHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}

.pageHead h1{
  margin:0 0 4px
}

.muted{color:var(--muted)}
.small{font-size:11px}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:var(--blue);
  color:white;
  font-weight:800
}

.btn.alt{
  background:#eaf1f7;
  color:var(--blue)
}

.btn.green{background:var(--green)}
.btn.danger{background:var(--red)}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  box-shadow:var(--shadow)
}

.statLabel{
  font-size:11px;
  color:var(--muted)
}

.statValue{
  font-size:27px;
  font-weight:900;
  margin-top:7px
}

.statSub{
  font-size:10px;
  color:var(--green);
  margin-top:4px
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-top:17px
}

.cardHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px
}

.cardHead h2{margin:0}

.searchRow{
  display:flex;
  gap:10px;
  margin-bottom:15px
}

input,select{
  width:100%;
  padding:11px 12px;
  border:1px solid #ccd6e0;
  border-radius:9px;
  background:white;
  outline:none
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(18,97,160,.09)
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:13px 9px;
  border-bottom:1px solid #edf0f3;
  font-size:12px
}

th{
  font-size:10px;
  color:#647386;
  text-transform:uppercase;
  letter-spacing:.3px
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:850
}

.status.Pending{
  background:#fff4df;
  color:#9a6100
}

.status.Approved{
  background:#eaf7ed;
  color:#176b35
}

.status.Rejected{
  background:#fff0f0;
  color:#a51d2d
}

.actionBtn{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  font-size:10px;
  font-weight:850
}

.actionBtn.approve{
  background:#eaf7ed;
  color:var(--green)
}

.actionBtn.reject{
  background:#fff0f0;
  color:var(--red)
}

.actionBtn.view{
  background:#eaf1f7;
  color:var(--blue)
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted)
}

.notice{
  padding:12px 14px;
  border-radius:9px;
  background:#eef5ff;
  color:#24527b;
  font-size:12px;
  margin-bottom:15px
}

.login{
  max-width:430px;
  margin:80px auto
}

.login .card{
  margin:0
}

label{
  display:block;
  font-size:11px;
  font-weight:800;
  margin:13px 0 5px
}

.detailGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.detail{
  background:#f7f9fc;
  border-radius:10px;
  padding:12px
}

.detailLabel{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase
}

.detailValue{
  font-size:13px;
  font-weight:800;
  margin-top:4px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(5,18,31,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50
}

.modalBox{
  background:white;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:17px;
  padding:22px
}

.footer{
  text-align:center;
  padding:25px;
  color:#7b8796;
  font-size:10px
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:700px){

  .top{
    padding:0 13px
  }

  .topRight span{
    display:none
  }

  .layout{
    display:block
  }

  .sidebar{
    display:flex;
    overflow:auto;
    padding:8px
  }

  .sideTitle{
    display:none
  }

  .navBtn{
    width:auto;
    white-space:nowrap;
    margin:0 3px
  }

  .main{
    padding:15px 11px
  }

  .grid{
    grid-template-columns:1fr 1fr
  }

  .tableWrap{
    overflow:auto
  }

  table{
    min-width:850px
  }

  .detailGrid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>


<section id="loginPage" class="login">

  <div class="card">

    <div class="brand">

      <div class="logo">N</div>

      NWB Financial

      <span class="adminBadge">
        ADMIN
      </span>

    </div>

    <h1 style="margin-top:25px">
      Administration
    </h1>

    <p class="muted">
      Sign in to the administration workspace.
    </p>

    <div id="loginMessage"></div>

    <label>Email</label>

    <input id="adminEmail"
           type="email"
           placeholder="Administrator email">

    <label>Password</label>

    <input id="adminPassword"
           type="password"
           placeholder="Password">

    <button class="btn"
            style="width:100%;margin-top:10px"
            onclick="adminLogin()">
      Sign in
    </button>

  </div>

</section>


<section id="adminApp" class="hidden">

<header class="top">

  <div class="brand">

    <div class="logo">N</div>

    NWB Financial

    <span class="adminBadge">
      ADMIN
    </span>

  </div>

  <div class="topRight">

    <span>Administrator</span>

    <div class="avatar">A</div>

    <button class="btn danger"
            onclick="adminLogout()">
      Sign out
    </button>

  </div>

</header>


<div class="layout">

<aside class="sidebar">

  <div class="sideTitle">
    Administration
  </div>

  <button class="navBtn active"
          onclick="showPage('overview',this)">
    Overview
  </button>

  <button class="navBtn"
          onclick="showPage('customers',this)">
    Customers
  </button>

  <button class="navBtn"
          onclick="showPage('accounts',this)">
    Accounts
  </button>

  <button class="navBtn"
          onclick="showPage('transactions',this)">
    Transactions
  </button>

  <button class="navBtn"
          onclick="showPage('requests',this)">
    Approval requests
  </button>

  <button class="navBtn"
          onclick="showPage('activity',this)">
    Activity
  </button>

</aside>


<main class="main">

  <div id="pageContent"></div>

  <div class="footer">
    NWB Financial Administration
  </div>

</main>

</div>

</section>


<div id="modal" class="modal hidden">

  <div class="modalBox">

    <div class="cardHead">

      <h2 id="modalTitle">
        Transaction
      </h2>

      <button class="btn alt"
              onclick="closeModal()">
        Close
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

const $=id=>document.getElementById(id);

let customers=[
  {
    id:"CUS-1001",
    name:"Alex Morgan",
    email:"alex@example.com",
    account:"1029384756",
    status:"Active"
  },
  {
    id:"CUS-1002",
    name:"Jordan Williams",
    email:"jordan@example.com",
    account:"5647382910",
    status:"Active"
  }
];

let accounts=[
  {
    customer:"CUS-1001",
    currency:"USD",
    balance:12500
  },
  {
    customer:"CUS-1001",
    currency:"GBP",
    balance:4200
  },
  {
    customer:"CUS-1002",
    currency:"EUR",
    balance:3100
  }
];

let transactions=[];

let activities=[];


function loadData(){

  try{

    const saved=
      localStorage.getItem("nwb_transactions");

    if(saved)
      transactions=JSON.parse(saved);

  }catch(e){

    transactions=[];

  }

}


function saveData(){

  localStorage.setItem(
    "nwb_transactions",
    JSON.stringify(transactions)
  );

}


function adminLogin(){

  const email=
    $("adminEmail").value.trim();

  const password=
    $("adminPassword").value;

  if(!email||!password){

    $("loginMessage").innerHTML=
      `<div class="notice">
        Enter the administrator email and password.
      </div>`;

    return;
  }

  $("loginPage").classList.add("hidden");
  $("adminApp").classList.remove("hidden");

  loadData();

  showPage(
    "overview",
    document.querySelector(".navBtn")
  );

}


function adminLogout(){

  $("adminApp").classList.add("hidden");
  $("loginPage").classList.remove("hidden");

  $("adminEmail").value="";
  $("adminPassword").value="";

}


function showPage(page,button){

  loadData();

  document
    .querySelectorAll(".navBtn")
    .forEach(x=>x.classList.remove("active"));

  if(button)
    button.classList.add("active");

  if(page==="overview")
    overview();

  if(page==="customers")
    customerPage();

  if(page==="accounts")
    accountPage();

  if(page==="transactions")
    transactionPage();

  if(page==="requests")
    requestPage();

  if(page==="activity")
    activityPage();

}


function overview(){

  const pending=
    transactions.filter(
      t=>t.status==="Pending"
    ).length;

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>

        <h1>Overview</h1>

        <div class="muted">
          Administration workspace
        </div>

      </div>

      <button class="btn"
              onclick="showPage('requests')">
        Review requests
      </button>

    </div>


    <div class="grid">

      <div class="stat">
        <div class="statLabel">Customers</div>
        <div class="statValue">${customers.length}</div>
        <div class="statSub">Active profiles</div>
      </div>

      <div class="stat">
        <div class="statLabel">Accounts</div>
        <div class="statValue">${accounts.length}</div>
        <div class="statSub">Currency accounts</div>
      </div>

      <div class="stat">
        <div class="statLabel">Transactions</div>
        <div class="statValue">${transactions.length}</div>
        <div class="statSub">Recorded activity</div>
      </div>

      <div class="stat">
        <div class="statLabel">Pending approval</div>
        <div class="statValue">${pending}</div>
        <div class="statSub">Awaiting review</div>
      </div>

    </div>


    <div class="card">

      <div class="cardHead">

        <h2>Pending approvals</h2>

        <button class="btn alt"
                onclick="showPage('requests')">
          Open requests
        </button>

      </div>

      ${pendingRows()}

    </div>


    <div class="card">

      <div class="cardHead">
        <h2>Recent activity</h2>
      </div>

      ${recentActivity()}

    </div>

  `;

}


function pendingRows(){

  const pending=
    transactions.filter(
      t=>t.status==="Pending"
    );

  if(!pending.length)
    return `<div class="empty">
      No transactions are waiting for approval.
    </div>`;

  return `

    <div class="tableWrap">

      <table>

        <tr>
          <th>Customer</th>
          <th>Recipient</th>
          <th>Amount</th>
          <th>Reference</th>
          <th></th>
        </tr>

        ${pending.slice(0,5).map(t=>`

          <tr>

            <td>
              ${escapeHtml(t.customerName||"Customer")}
            </td>

            <td>
              <strong>
                ${escapeHtml(t.recipientName||"—")}
              </strong>

              <div class="small muted">
                ${escapeHtml(t.recipientAccount||"—")}
              </div>
            </td>

            <td>
              ${money(t.amount,t.currency)}
            </td>

            <td>
              ${t.id}
            </td>

            <td>
              <button class="actionBtn approve"
                      onclick="viewRequest('${t.id}')">
                Review
              </button>
            </td>

          </tr>

        `).join("")}

      </table>

    </div>

  `;

}


function requestPage(){

  loadData();

  const pending=
    transactions.filter(
      t=>t.status==="Pending"
    );

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>

        <h1>Approval requests</h1>

        <div class="muted">
          Review pending transaction requests.
        </div>

      </div>

    </div>


    <div class="card">

      ${
        pending.length
        ?`
        <div class="tableWrap">

          <table>

            <tr>
              <th>Customer</th>
              <th>Recipient</th>
              <th>Account</th>
              <th>Bank</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Action</th>
            </tr>

            ${pending.map(t=>`

              <tr>

                <td>
                  ${escapeHtml(t.customerName||"Customer")}
                </td>

                <td>
                  <strong>
                    ${escapeHtml(t.recipientName)}
                  </strong>
                </td>

                <td>
                  ${escapeHtml(t.recipientAccount)}
                </td>

                <td>
                  ${escapeHtml(t.recipientBank)}
                </td>

                <td>
                  ${money(t.amount,t.currency)}
                </td>

                <td>
                  ${new Date(t.createdAt).toLocaleString()}
                </td>

                <td>

                  <button class="actionBtn approve"
                          onclick="approveTransaction('${t.id}')">
                    Approve
                  </button>

                  <button class="actionBtn reject"
                          onclick="rejectTransaction('${t.id}')">
                    Reject
                  </button>

                </td>

              </tr>

            `).join("")}

          </table>

        </div>
        `
        :`
        <div class="empty">
          No pending transactions.
        </div>
        `
      }

    </div>

  `;

}


function viewRequest(id){

  loadData();

  const t=
    transactions.find(x=>x.id===id);

  if(!t)return;

  $("modalTitle").textContent=
    "Transaction review";

  $("modalContent").innerHTML=`

    <div class="detailGrid">

      <div class="detail">
        <div class="detailLabel">
          Reference
        </div>
        <div class="detailValue">
          ${t.id}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Status
        </div>
        <div class="detailValue">
          <span class="status ${t.status}">
            ${t.status}
          </span>
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Customer
        </div>
        <div class="detailValue">
          ${escapeHtml(t.customerName||"Customer")}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Currency
        </div>
        <div class="detailValue">
          ${t.currency}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Recipient
        </div>
        <div class="detailValue">
          ${escapeHtml(t.recipientName)}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Account number
        </div>
        <div class="detailValue">
          ${escapeHtml(t.recipientAccount)}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Bank
        </div>
        <div class="detailValue">
          ${escapeHtml(t.recipientBank)}
        </div>
      </div>

      <div class="detail">
        <div class="detailLabel">
          Amount
        </div>
        <div class="detailValue">
          ${money(t.amount,t.currency)}
        </div>
      </div>

    </div>

    <div style="display:flex;
                gap:10px;
                margin-top:20px">

      <button class="btn green"
              onclick="approveTransaction('${t.id}')">
        Approve
      </button>

      <button class="btn danger"
              onclick="rejectTransaction('${t.id}')">
        Reject
      </button>

    </div>

  `;

  openModal();

}


function approveTransaction(id){

  loadData();

  const t=
    transactions.find(x=>x.id===id);

  if(!t||t.status!=="Pending")
    return;

  t.status="Approved";

  t.approvedAt=
    new Date().toISOString();

  saveData();

  activities.unshift({
    title:"Transaction approved: "+id,
    time:"Just now"
  });

  closeModal();

  showPage(
    "requests",
    document.querySelectorAll(".navBtn")[4]
  );

}


function rejectTransaction(id){

  loadData();

  const t=
    transactions.find(x=>x.id===id);

  if(!t||t.status!=="Pending")
    return;

  t.status="Rejected";

  t.rejectedAt=
    new Date().toISOString();

  saveData();

  activities.unshift({
    title:"Transaction rejected: "+id,
    time:"Just now"
  });

  closeModal();

  showPage(
    "requests",
    document.querySelectorAll(".navBtn")[4]
  );

}


function customerPage(){

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>
        <h1>Customers</h1>
        <div class="muted">
          Customer profiles
        </div>
      </div>

    </div>


    <div class="card">

      <div class="searchRow">

        <input id="customerSearch"
               placeholder="Search customers"
               oninput="filterCustomers()">

      </div>

      <div id="customerTable">
        ${customerRows(customers)}
      </div>

    </div>

  `;

}


function filterCustomers(){

  const q=
    $("customerSearch").value
      .toLowerCase()
      .trim();

  const list=
    customers.filter(c=>
      c.name.toLowerCase().includes(q)||
      c.email.toLowerCase().includes(q)||
      c.account.includes(q)
    );

  $("customerTable").innerHTML=
    customerRows(list);

}


function customerRows(list){

  if(!list.length)
    return `<div class="empty">No customers found.</div>`;

  return `

    <div class="tableWrap">

      <table>

        <tr>
          <th>Customer</th>
          <th>Email</th>
          <th>Account</th>
          <th>Status</th>
        </tr>

        ${list.map(c=>`

          <tr>

            <td>
              <strong>${escapeHtml(c.name)}</strong>

              <div class="small muted">
                ${c.id}
              </div>
            </td>

            <td>
              ${escapeHtml(c.email)}
            </td>

            <td>
              ${c.account}
            </td>

            <td>
              <span class="status Approved">
                ${c.status}
              </span>
            </td>

          </tr>

        `).join("")}

      </table>

    </div>

  `;

}


function accountPage(){

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>
        <h1>Accounts</h1>
        <div class="muted">
          Customer currency accounts
        </div>
      </div>

    </div>


    <div class="card">

      <div class="tableWrap">

        <table>

          <tr>
            <th>Customer</th>
            <th>Currency</th>
            <th>Balance</th>
            <th>Status</th>
          </tr>

          ${accounts.map(a=>{

            const c=
              customers.find(x=>x.id===a.customer);

            return `

              <tr>

                <td>
                  ${c?escapeHtml(c.name):"Customer"}
                </td>

                <td>
                  <strong>${a.currency}</strong>
                </td>

                <td>
                  ${money(a.balance,a.currency)}
                </td>

                <td>
                  <span class="status Approved">
                    Active
                  </span>
                </td>

              </tr>

            `;

          }).join("")}

        </table>

      </div>

    </div>

  `;

}


function transactionPage(){

  loadData();

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>
        <h1>Transactions</h1>
        <div class="muted">
          Transaction history
        </div>
      </div>

    </div>


    <div class="card">

      <div class="tableWrap">

        <table>

          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Recipient</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>

          ${transactions.length
            ?transactions.map(t=>`

              <tr>

                <td>
                  ${t.id}
                </td>

                <td>
                  ${escapeHtml(t.customerName||"Customer")}
                </td>

                <td>
                  ${escapeHtml(t.recipientName||"—")}
                </td>

                  ${money(t.amount,t.currency)}
                </td>

                <td>
                  <span class="status ${t.status}">
                    ${t.status}
                  </span>
                </td>

                <td>
                  ${new Date(t.createdAt).toLocaleString()}
                </td>

              </tr>

            `).join("")
            :`
              <tr>

                </td>
              </tr>
            `
          }

        </table>

      </div>

    </div>

  `;

}


function activityPage(){

  $("pageContent").innerHTML=`

    <div class="pageHead">

      <div>
        <h1>Activity</h1>
        <div class="muted">
          Administration activity
        </div>
      </div>

    </div>


    <div class="card">

      ${
        activities.length
        ?activities.map(a=>`

          <div style="padding:13px 0;
                      border-bottom:1px solid #edf0f3">

            <strong>
              ${escapeHtml(a.title)}
            </strong>

            <div class="small muted">
              ${escapeHtml(a.time)}
            </div>

          </div>

        `).join("")
        :`
          <div class="empty">
            No activity yet.
          </div>
        `
      }

    </div>

  `;

}


function recentActivity(){

  if(!activities.length)
    return `<div class="empty">No recent activity.</div>`;

  return activities.slice(0,5).map(a=>`

    <div style="padding:12px 0;
                border-bottom:1px solid #edf0f3">

      <strong>
        ${escapeHtml(a.title)}
      </strong>

      <div class="small muted">
        ${escapeHtml(a.time)}
      </div>

    </div>

  `).join("");

}


function money(value,currency){

  const symbols={
    USD:"$",
    GBP:"£",
    EUR:"€",
    NGN:"₦",
    ZAR:"R",
    CAD:"C$",
    AUD:"A$",
    CHF:"CHF ",
    JPY:"¥",
    AED:"د.إ ",
    SGD:"S$",
    NZD:"NZ$"
  };

  return (symbols[currency]||"")+
    Number(value).toLocaleString(undefined,{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function openModal(){

  $("modal").classList.remove("hidden");

}


function closeModal(){

  $("modal").classList.add("hidden");

}


/*
  Refresh the approval queue automatically.
*/

setInterval(()=>{

  if(!$("adminApp").classList.contains("hidden")){

    const active=
      document.querySelector(".navBtn.active");

    if(active &&
       active.textContent.includes("Approval")){

      requestPage();

    }

  }

},3000);

</script>
